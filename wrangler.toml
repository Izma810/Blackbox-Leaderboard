name = "whackamodel"
main = "src/index.ts"
compatibility_date = "2024-10-22"
compatibility_flags = ["nodejs_compat"]

[[durable_objects.bindings]]
name = "GAME_ROOM"
class_name = "GameRoomDO"

# SQLite-backed Durable Objects — the only kind allowed on the Workers Free plan.
# A class's storage type is fixed at its first deploy, so don't change this later.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameRoomDO"]

[[d1_databases]]
binding = "DB"
database_name = "blackbox-leaderboard"
database_id = "03ab4c7d-13c2-42f9-ae81-2e07e5907ad3"

[vars]
ENVIRONMENT = "production"

# Static assets: the Vite plugin populates assets.directory from the client build.
# run_worker_first ensures /api/* requests always hit the Worker.
# not_found_handling = "single-page-application" makes deep links fall back to index.html.
[assets]
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# Secrets (not vars — never commit values):
#   local:      set in .dev.vars (gitignored)
#   production: npx wrangler secret put ADMIN_PASSWORD
#               npx wrangler secret put SESSION_SECRET
