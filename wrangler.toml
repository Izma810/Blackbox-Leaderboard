name = "blackbox-leaderboard"
main = "src/index.ts"
compatibility_date = "2024-10-22"
compatibility_flags = ["nodejs_compat"]

[[durable_objects.bindings]]
name = "GAME_ROOM"
class_name = "GameRoomDO"

# SQLite-backed Durable Objects — the only kind allowed on the Workers Free plan.
# A class's storage type is fixed at its first deploy, so don't change this later.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameRoomDO"]

[[d1_databases]]
binding = "DB"
database_name = "blackbox-leaderboard"
# Replace with the id printed by: npx wrangler d1 create blackbox-leaderboard
database_id = "664e0dc2-3308-44be-bd39-ca086368c765"

[vars]
ENVIRONMENT = "production"

# ADMIN_PASSWORD is a secret, not a var:
#   local:      ADMIN_PASSWORD=... in .dev.vars (gitignored)
#   production: npx wrangler secret put ADMIN_PASSWORD
